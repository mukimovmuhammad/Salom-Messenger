# Include inside the HTTPS server block for mukimov.site.
location = /.well-known/assetlinks.json {
    default_type application/json;
    try_files $uri =404;
}

location = /profile-link.html {
    internal;
}

location ~* "^/(?:u/[a-z][a-z0-9_]{3,23}|(?!(?:salom|privacy|terms)$)[a-z][a-z0-9_]{3,23})$" {
    try_files $uri $uri/ /profile-link.html;
}
