plugins {
    id 'com.google.gms.google-services'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}
def releaseSigningValues = [
    storeFile: providers.gradleProperty('salomReleaseStoreFile').orElse(providers.environmentVariable('SALOM_RELEASE_STORE_FILE')).orNull,
    storePassword: providers.gradleProperty('salomReleaseStorePassword').orElse(providers.environmentVariable('SALOM_RELEASE_STORE_PASSWORD')).orNull,
    keyAlias: providers.gradleProperty('salomReleaseKeyAlias').orElse(providers.environmentVariable('SALOM_RELEASE_KEY_ALIAS')).orNull,
    keyPassword: providers.gradleProperty('salomReleaseKeyPassword').orElse(providers.environmentVariable('SALOM_RELEASE_KEY_PASSWORD')).orNull,
]
def hasReleaseSigning = releaseSigningValues.values().every { it != null && !it.isBlank() } && file(releaseSigningValues.storeFile).isFile()
android {
    namespace 'com.mukimov.salom'
    compileSdkVersion 'android-36.1'
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.mukimov.salom'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '0.15.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    if (hasReleaseSigning) {
        signingConfigs {
            salomRelease {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasReleaseSigning ? signingConfigs.salomRelease : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
tasks.register('verifySalomReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is not configured. Run tools/build-android-release.ps1 to load the protected local signing profile; never commit the keystore or passwords.')
        }
    }
}
tasks.configureEach {
    if (name in ['assembleRelease', 'bundleRelease']) dependsOn('verifySalomReleaseSigning')
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation 'io.github.webrtc-sdk:android:150.7871.04'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
}
